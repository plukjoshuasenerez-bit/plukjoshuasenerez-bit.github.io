<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEAM JOSH KPI Form</title>
  <style>
    :root{--navy:#071a33;--blue:#0b5ed7;--gold:#f3b51b;--bg:#f4f6fb;--line:#dfe4ef;--text:#182033;--muted:#667085;--green:#138a36;--red:#b80d14}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:22px 16px 28px}
    header h1{margin:0;font-size:24px}header p{margin:8px 0 0;color:#dbeafe}
    main{max-width:760px;margin:-14px auto 30px;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(7,26,51,.09)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}button{width:100%;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}.tab{background:#fff;color:var(--navy);border:1px solid var(--navy)}.tab.active,.primary{background:var(--navy);color:#fff}
    label{display:block;font-size:12px;font-weight:800;color:#344054;margin:12px 0 5px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .kpi{border:1px solid var(--line);border-radius:12px;padding:13px;background:#f8fafc}.kpi span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.kpi strong{display:block;font-size:22px;color:var(--navy);margin-top:4px}
    .level{display:inline-block;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;background:#e5e7eb}.bronze{background:#cd7f32;color:#fff}.silver{background:#cbd5e1}.gold{background:#facc15}.diamond{background:#67e8f9}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left}th{background:var(--navy);color:#fff}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:12px}.notice{border-left:5px solid var(--gold);background:#fffbeb;padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px}.ok{border-left-color:var(--green);background:#ecfdf5}.error{border-left-color:var(--red);background:#fef2f2}.hidden{display:none}.small{font-size:12px;color:var(--muted)}
    @media(max-width:540px){.grid,.kpis{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>TEAM JOSH Agent KPI</h1><p>Submit activities and view your status.</p></header>
  <main>
    <div class="tabs"><button id="tabForm" class="tab active" onclick="showView('form')">Submit KPI</button><button id="tabStatus" class="tab" onclick="showView('status')">My Status</button></div>
    <section class="panel hidden" id="setupPanel"><label>Firebase Config JSON</label><textarea id="cfgInput" rows="4" placeholder="Ask admin to resend the generated link"></textarea><button class="primary" onclick="saveManualConfig()">Save Config</button></section>
    <section id="formView" class="panel"><div id="formNotice" class="notice hidden"></div><label>Date</label><input id="date" type="date"><label>Agent Name</label><input id="agent" placeholder="Type your full name"><div class="grid" id="activityFields"></div><label>Notes</label><textarea id="notes" rows="3" placeholder="Optional"></textarea><button class="primary" onclick="submitKpi()">Submit KPI</button></section>
    <section id="statusView" class="panel hidden"><div id="statusNotice" class="notice hidden"></div><label>Agent Name</label><input id="statusAgent" placeholder="Type your full name"><div class="grid"><div><label>Start Date</label><input id="start" type="date"></div><div><label>End Date</label><input id="end" type="date"></div></div><button class="primary" onclick="loadStatus()">Load My Status</button><div id="statusResult" style="margin-top:14px"></div></section>
  </main>
  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getFirestore, collection, doc, setDoc, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
    const ACTS=[['prodServicing','Client Servicing',10],['prodProspecting','Prospecting',1],['prodPresentation','Client Presentation',50],['prodSelling','Selling Approach',1],['prodRecruitment','Recruitment',1],['prodClosing','Closing',100],['prodTraining','Training',5],['prodBranding','Branding',1],['prodEngage','Engage',1],['prodAppointment','Setting Appointment',10]];
    const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), num=v=>{const n=Number(String(v??'').replace(/[^0-9.-]/g,''));return isNaN(n)?0:n};
    let firebaseConfig=null, firestoreDb=null;
    function decodeCfg(text){return JSON.parse(decodeURIComponent(escape(atob(text))))}
    function readConfig(){const q=new URLSearchParams(location.search);if(q.get('cfg'))localStorage.teamJoshFirebaseConfig=JSON.stringify(decodeCfg(q.get('cfg')));try{firebaseConfig=JSON.parse(localStorage.teamJoshFirebaseConfig||'null')}catch(e){}$('cfgInput').value=firebaseConfig?JSON.stringify(firebaseConfig):'';$('setupPanel').classList.toggle('hidden',!!firebaseConfig)}
    window.saveManualConfig=function(){try{firebaseConfig=JSON.parse($('cfgInput').value);localStorage.teamJoshFirebaseConfig=JSON.stringify(firebaseConfig);$('setupPanel').classList.add('hidden');notice('formNotice','Config saved.','ok')}catch(e){notice('formNotice','Invalid Firebase config JSON.','error')}}
    function db(){if(!firebaseConfig)throw new Error('Missing form setup. Ask admin to resend the generated link.');if(!firestoreDb){const name='team-josh-agent-'+(firebaseConfig.projectId||'default');const app=getApps().find(a=>a.name===name)||initializeApp(firebaseConfig,name);firestoreDb=getFirestore(app)}return firestoreDb}
    function points(row){return ACTS.reduce((s,[k,,p])=>s+num(row[k])*p,0)}function level(p){p=num(p);if(p>=300)return ['DIAMOND','diamond'];if(p>=150)return ['GOLD','gold'];if(p>=100)return ['SILVER','silver'];if(p>=50)return ['BRONZE','bronze'];return ['Below Average','']}
    function notice(id,msg,kind){const el=$(id);el.textContent=msg;el.className='notice '+(kind||'');el.classList.remove('hidden')}
    window.showView=function(view){$('formView').classList.toggle('hidden',view!=='form');$('statusView').classList.toggle('hidden',view!=='status');$('tabForm').classList.toggle('active',view==='form');$('tabStatus').classList.toggle('active',view==='status')}
    window.submitKpi=async function(){try{const agent=$('agent').value.trim();if(!agent)return notice('formNotice','Please enter your agent name.','error');localStorage.teamJoshKpiAgent=agent;const id='AGENT_'+Date.now()+'_'+Math.random().toString(16).slice(2);const body={id,date:$('date').value||today(),agent,notes:$('notes').value.trim(),source:'agent-link',createdAt:serverTimestamp(),updatedAt:serverTimestamp()};ACTS.forEach(([k,label])=>{body[k]=num($(k).value);body[label]=num($(k).value)});body.totalPoints=points(body);body.level=level(body.totalPoints)[0];await setDoc(doc(db(),'kpiEntries',id),body,{merge:true});ACTS.forEach(([k])=>$(k).value=0);$('notes').value='';$('statusAgent').value=agent;notice('formNotice','Submitted. Points for this entry: '+body.totalPoints,'ok')}catch(e){notice('formNotice',e.message||String(e),'error')}}
    function rowToEntry(row){const e={date:String(row.Date||row.date||'').slice(0,10),agent:String(row.Agent||row.agent||row.Name||'').trim()};ACTS.forEach(([k,label])=>e[k]=num(row[k]||row[label]));return e}
    window.loadStatus=async function(){try{const agent=$('statusAgent').value.trim();if(!agent)return notice('statusNotice','Please enter your agent name.','error');localStorage.teamJoshKpiAgent=agent;const start=$('start').value,end=$('end').value;const snap=await getDocs(collection(db(),'kpiEntries'));const list=[];snap.forEach(d=>list.push(rowToEntry(d.data()||{})));const mine=list.filter(e=>e.agent.toLowerCase()===agent.toLowerCase()).filter(e=>(!start||e.date>=start)&&(!end||e.date<=end));const total=mine.reduce((s,e)=>s+points(e),0),lv=level(total);const counts={};ACTS.forEach(([k,label])=>counts[label]=mine.reduce((s,e)=>s+num(e[k]),0));$('statusResult').innerHTML=`<div class="kpis"><div class="kpi"><span>Total Points</span><strong>${total.toLocaleString()}</strong></div><div class="kpi"><span>Submissions</span><strong>${mine.length.toLocaleString()}</strong></div><div class="kpi"><span>Level</span><strong><span class="level ${lv[1]}">${lv[0]}</span></strong></div><div class="kpi"><span>Latest Date</span><strong>${esc((mine.map(x=>x.date).sort().pop())||'-')}</strong></div></div><h3>Activity Breakdown</h3><div class="tablebox"><table><tr><th>Activity</th><th>Count</th><th>Points</th></tr>${ACTS.map(([k,label,p])=>`<tr><td>${label}</td><td>${counts[label].toLocaleString()}</td><td>${(counts[label]*p).toLocaleString()}</td></tr>`).join('')}</table></div>`;notice('statusNotice','Loaded '+mine.length+' entries for '+agent+'.','ok')}catch(e){notice('statusNotice',e.message||String(e),'error')}}
    function init(){readConfig();$('date').value=today();$('end').value=today();const agent=new URLSearchParams(location.search).get('agent')||localStorage.teamJoshKpiAgent||'';$('agent').value=agent;$('statusAgent').value=agent;$('activityFields').innerHTML=ACTS.map(([k,label])=>`<div><label>${label}</label><input id="${k}" type="number" min="0" value="0" inputmode="numeric"></div>`).join('');if(new URLSearchParams(location.search).get('view')==='status')showView('status')}
    init();
  </script>
</body>
</html>
